[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "casemind-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "google-adk==2.11.0", "google-genai==2.29.0", "fastapi==0.141.1",
  "uvicorn==0.54.0", "google-cloud-storage==3.17.0",
  "google-cloud-bigquery==3.46.1", "google-cloud-documentai==3.16.0",
  "reportlab==5.0.1", "pypdfium2==5.0.0", "pydantic==2.14.0"
]
[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.16.10"]
[tool.setuptools.packages.find]
where = ["backend"]
[tool.setuptools.package-data]
casemind = ["data/*.json"]
[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
markers = ["live_gcp: calls billed Google Cloud APIs"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
